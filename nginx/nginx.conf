# The two API replicas. "api1" and "api2" are the service names from docker-compose.
upstream api {
    server api1:8080;
    server api2:8080;
}

# Plain HTTP only redirects to HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    # Self-signed certificate, created when the nginx image is built
    ssl_certificate     /etc/nginx/certs/tabby.crt;
    ssl_certificate_key /etc/nginx/certs/tabby.key;

    root /usr/share/nginx/html;
    index index.html;

    # REST API: round-robin between the replicas
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows in DevTools which replica answered: proof that the balancing works
        add_header X-Upstream $upstream_addr always;
    }

    # SignalR: same replicas, but the connection must be upgraded to a WebSocket
    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;   # idle WebSockets must not be cut after the default 60s
    }

    # The API's health endpoint, reachable from outside for checking
    location = /health {
        proxy_pass http://api;
        add_header X-Upstream $upstream_addr always;
    }

    # Everything else is the React app. Unknown paths (like /receipts) get index.html,
    # because React Router handles them in the browser.
    location / {
        try_files $uri /index.html;
    }
}